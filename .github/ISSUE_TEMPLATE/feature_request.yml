name: Feature request
description: Something the editor should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the drawing you are trying to make, or the workflow you are
        stuck in — not just the feature. The best solution is often not the one
        that first comes to mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: How you imagine it working, if you have a view.

  - type: textarea
    id: prior-art
    attributes:
      label: How other tools do it
      description: >
        Illustrator, Figma, Inkscape, Affinity — naming the closest equivalent
        and what is right or wrong about it helps a lot.

  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: The workaround, if there is one.
